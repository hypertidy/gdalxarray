# Test matrix: runs on every push/PR to main.
# Uses micromamba to install GDAL Python bindings from conda-forge
# (GDAL has no usable PyPI wheels).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}   # micromamba env auto-activated
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba with GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          create-args: >-
            python=${{ matrix.python-version }}
            gdal
            libgdal-netcdf
            numpy
            xarray
            dask
            affine
            rasterix
            xproj
            pytest
          cache-environment: true
          cache-downloads: true

      - name: Install gdalxarray (editable, no deps)
        run: pip install -e . --no-deps

      - name: Show environment
        run: |
          python -c "from osgeo import gdal; print('GDAL', gdal.__version__)"
          python -c "import gdalxarray; print('gdalxarray', gdalxarray.__version__)"
          python -c "import xarray as xr; print('engines:', list(xr.backends.list_engines()))"

      - name: Lint
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Run tests
        run: pytest -q

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build
          ls -la dist/
