# Docs: render the Quarto site and publish it to gh-pages.
#
# Every page executes on every build, so this workflow is also a test:
#   - pull requests render the site (no deploy), and fail if any guide
#     example or fixture check fails;
#   - pushes to main render and deploy;
#   - a weekly run re-renders against the current GDAL image and fails
#     if a store marked pinned or permanent in docs/stores.yml has gone.
#
# Runs in ghcr.io/hypertidy/gdal-r-python, which has GDAL (with the
# Zarr, netCDF, Parquet and, when built in, Icechunk support) and its
# Python bindings, so no environment solving is needed.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 0"   # Sunday 19:17 UTC (Monday morning in Hobart)
  workflow_dispatch: {}

permissions:
  contents: write   # to push gh-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.9.38"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/hypertidy/gdal-r-python:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Quarto
        run: |
          python3 - <<'EOF'
          import os, tarfile, urllib.request
          v = os.environ["QUARTO_VERSION"]
          url = f"https://github.com/quarto-dev/quarto-cli/releases/download/v{v}/quarto-{v}-linux-amd64.tar.gz"
          path, _ = urllib.request.urlretrieve(url)
          tarfile.open(path).extractall("/opt")
          EOF
          echo "/opt/quarto-${QUARTO_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Install docs dependencies
        run: |
          pip install --break-system-packages --upgrade pip
          pip install --break-system-packages jupyter nbclient nbformat matplotlib pandas pyyaml dask \
            quartodoc "griffe<2"
          pip install --break-system-packages -e .

      - name: Versions
        run: |
          quarto --version
          python3 -c "from osgeo import gdal; print('GDAL', gdal.__version__); print([p for p in gdal.GetFileSystemsPrefixes() if 'ice' in p])"
          python3 -c "import gdalxarray, xarray; print('gdalxarray', gdalxarray.__version__, 'xarray', xarray.__version__)"

      - name: Check remote stores
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 scripts/check_stores.py --strict
          else
            python3 scripts/check_stores.py
          fi

      - name: Build API reference
        working-directory: docs
        run: python3 -m quartodoc build

      - name: Render site
        timeout-minutes: 60
        working-directory: docs
        env:
          QUARTO_PYTHON: python3
        run: quarto render

      - name: Summarise store check
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("docs/_stores_status.json")
          st = json.loads(p.read_text()) if p.exists() else {}
          print("| store | ok | detail |\n|---|---|---|")
          for k, v in sorted(st.items()):
              print(f"| {k} | {v.get('ok')} | {v.get('summary') or v.get('error', '')} |")
          EOF

      - name: Upload rendered site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/_site
          retention-days: 14

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          force_orphan: true
