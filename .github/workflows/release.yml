# Release workflow: triggered by version tags (v0.3.0 etc.).
# Builds wheel + sdist and publishes to PyPI via Trusted Publishing (OIDC).
# No API tokens needed - configure once at:
#   https://pypi.org/manage/account/publishing/
# with publisher: hypertidy/gdalxarray, workflow: release.yml, env: pypi
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: List artefacts
        run: ls -la dist/

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gdalxarray/
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
