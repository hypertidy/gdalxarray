# Run with: pre-commit install (one-time per checkout)
# Then ruff fires on every commit; tests can be wired in via CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21  # keep the single source of ruff version truth here; CI runs pre-commit
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
