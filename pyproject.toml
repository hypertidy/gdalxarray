[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "gdalxarray/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["gdalxarray"]

[tool.hatch.build.targets.wheel.force-include]
"gdalxarray/py.typed" = "gdalxarray/py.typed"

[project]
name = "gdalxarray"
dynamic = ["version"]
description = "xarray extension for GDAL"
authors = [
    {name = "Michael Sumner", email = "mdsumner@gmail.com"},
]
keywords = [
    "GDAL",
    "xarray",
    "osgeo"
]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Oceanography", 
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "packaging",
    "affine",
    "rasterix",
    "xarray>=2025.6",
    "numpy",
    "dask",
    "xproj",
    # GDAL must be installed separately; see INSTALL.md
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.7", "pre-commit", "build", "hatchling"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: tests that require network access (skipped by default)",
]

[project.urls]
Homepage = "https://github.com/hypertidy/gdalxarray"
Repository = "https://github.com/hypertidy/gdalxarray"
Issues = "https://github.com/hypertidy/gdalxarray/issues"
Changelog = "https://github.com/hypertidy/gdalxarray/blob/main/CHANGELOG.md"

[project.entry-points."xarray.backends"]
gdalxarray = "gdalxarray.backend:GDALBackendEntrypoint"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names)
    "I",     # isort (import sorting)
    "B",     # bugbear (mutable defaults, bare except, etc.)
    "UP",    # pyupgrade (modern syntax)
    "SIM",   # simplify (clearer code)
]
ignore = [
    "E501",  # line too long — formatter handles it
    "E402",  # module-level imports not at top of file (some intentional in __init__)
    "SIM108", # ternary expression preference (sometimes if/else reads better)
]

[tool.ruff.format]
# Keep formatter compatible with `black` style; use ruff format in pre-commit.
quote-style = "double"
indent-style = "space"
